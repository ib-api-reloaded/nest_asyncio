name: CI

on: [ push, pull_request, workflow_dispatch ]

env:
  FORCE_COLOR: 1

jobs:
  uv:
    name: uv (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]

    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install package
        run: |
          uv pip install --python "${{ steps.setup-python.outputs.python-path }}" --system -e .

      - name: Testsuite
        run: |
          uv run --python "${{ steps.setup-python.outputs.python-path }}" --no-sync python -W error::DeprecationWarning -m unittest tests.nest_test

  checks:
    name: checks (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - uses: astral-sh/setup-uv@v7
      - name: Install dev dependencies
        run: |
          uv sync --python "${{ steps.setup-python.outputs.python-path }}" --group dev
      - name: Ruff check
        run: |
          uv run --python "${{ steps.setup-python.outputs.python-path }}" --no-sync ruff check .
      - name: Ruff format
        run: |
          uv run --python "${{ steps.setup-python.outputs.python-path }}" --no-sync ruff format --check .
      - name: MyPy
        if: ${{ !startsWith(matrix.python-version, 'pypy') }}
        run: |
          uv run --python "${{ steps.setup-python.outputs.python-path }}" --no-sync mypy nest_asyncio
