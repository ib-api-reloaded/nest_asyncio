[project]
name = "nest_asyncio"
version = "1.6.0"
description = "Patch asyncio to allow nested event loops"
authors = [{ name = "Ewald R. de Wit" }]
license = "BSD-2-Clause"
readme = "README.rst"
requires-python = ">=3.11"
dependencies = []
keywords = ["asyncio", "nested", "eventloop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Framework :: AsyncIO"
]
urls = { Homepage = "https://github.com/erdewit/nest_asyncio", Repository = "https://github.com/erdewit/nest_asyncio" }

[tool.poetry]
requires-poetry = ">=2.1"
packages = [{ include = "nest_asyncio" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.17.0,<0.18.0"
mypy = "*"

[dependency-groups]
dev = [
    "ruff>=0.17.0,<0.18.0",
    "mypy",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Listed explicitly so a ruff upgrade never changes what is checked.
select = [
  # pycodestyle errors and pyflakes (ruff's long-standing defaults)
  "E4",
  "E7",
  "E9",
  "F",
  # convert legacy python syntax to modern syntax
  "UP",
  # isort imports
  "I",
  # simplifications
  "SIM",
  # pathlib over os.path / open()
  "PTH",
  # modern idioms (refurb)
  "FURB",
  # specific ignore / type-ignore codes
  "PGH",
]
ignore = [
  "SIM102", # collapsible-if: nested ifs often read clearer
  "SIM110", # reimplemented-builtin: explicit loops often read clearer
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["nest_asyncio"]
strict = false
